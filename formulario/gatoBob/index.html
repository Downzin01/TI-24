<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./assets/css/style.css" />
        <title>Gato Bob</title>
    </head>
    <body>
        <main>
            <section id="login-section" action="dados.html" method="get">
                <div class="login-container">
                    <form>
                        <h1>De volta à sua vida</h1>
                        <p>Escolha uma das opções</p>
                        <br />
                        <br />
                        <input
                            type="email"
                            class="login-input"
                            placeholder="Digite seu Email"
                            id="email"
                            name="email"
                        />
                        <input
                            type="password"
                            class="login-input"
                            placeholder="Digite sua senha"
                            id="senha"
                            name="senha"
                        />
                        <br />
                        <br />
                        <div class="login-linha-marcador">
                            <span>Ou continue com</span>
                            <hr />
                        </div>
                        <br />
                        <br />
                        <div class="login-buttons">
                            <a href="#">
                                <img src="./assets/img/google.png" alt="Icone Google" />
                            </a>
                            <a href="#">
                                <img src="./assets/img/meta.png" alt="Icone Meta" />
                            </a>
                            <a href="#">
                                <img src="./assets/img/apple.png" alt="Icone Apple" />
                            </a>
                        </div>

                        <br />
                        <br />
                        <button class="login-button-submit" type="submit">Enviar</button>
                    </form>
                </div>
            </section>
        </main>
    </body>
</html>
